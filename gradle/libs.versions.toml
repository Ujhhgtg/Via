[versions]
agp = "9.4.1"
kotlin = "2.4.20"

androidx-activity = "1.13.0"
androidx-core = "1.18.0"
androidx-fragment = "1.9.1"
androidx-recyclerview = "1.4.0"
androidx-viewpager2 = "1.1.0"
androidx-customview = "1.2.0"
androidx-dynamicanimation = "1.0.0"
androidx-webkit = "1.17.1"
# Pinned exactly: GeckoView has no compatibility guarantees between builds.
geckoview = "159.0.20261102144711"
androidx-biometric = "1.1.0"

okhttp = "5.5.0"
ktor = "3.6.0"

zxing-core = "3.5.4"
zxing-embedded = "4.3.0"
tinypinyin = "2.0.3"

aboutlibraries = "15.2.0"

compose-bom = "2026.09.00"
# Segmented list items (ListItemDefaults.segmentedShapes / SegmentedListItem) are still
# alpha-only; KernelSU ships the same build, so the Compose settings screen mirrors it.
material3 = "1.5.0-alpha28"

junit = "4.13.2"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "androidx-viewpager2" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "androidx-customview" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidx-dynamicanimation" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
geckoview-arm64 = { module = "org.mozilla.geckoview:geckoview-arm64-v8a", version.ref = "geckoview" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }

ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }
tinypinyin = { module = "com.github.promeg:tinypinyin", version.ref = "tinypinyin" }

aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }

junit = { module = "junit:junit", version.ref = "junit" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
